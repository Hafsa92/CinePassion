<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciné Passion - Films</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Film.css">
</head>
<body>

      <h1>Tous nos films</h1>
      <p>Clique sur un film pour voir ses séances du jour et sa bande-annonce.</p>

      <article class="Avanger" data-genre="Action">
        <img src="" alt="Affiche du film Titre du film 1">
        <div class="film-infos">
          <h2>Titre du film 1</h2>
          <p class="genre">Action</p>
          <p class="date">Sortie : 12 novembre 2026</p>
        </div>
        <div class="details">
          <h3>Séances du jour</h3>
          <ul class="horaires">
            <li>14:00</li>
            <li>17:15</li>
            <li>20:30</li>
          </ul>
          <h3>Bande-annonce</h3>
        </div>
      </article>

      
</body>
</html>
